<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdd3">
  <meta name="description" content="A little conversation, one letter at a time.">
  <title>hello world</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      background: #fffdd3;
      color: #e8771e;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      display: grid;
      align-content: center;
      min-height: 100svh;
      padding: 8vw;
    }
    h1 {
      margin: 0;
      min-height: 3.24em;
      max-width: 1440px;
      font-size: clamp(3rem, 10.5vw, 10rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -.065em;
      overflow-wrap: break-word;
    }
    #typed { white-space: pre-wrap; }
    .typed-cursor {
      display: inline-block;
      width: .045em;
      height: .78em;
      margin-left: .07em;
      vertical-align: -.025em;
      background: currentColor;
      letter-spacing: 0;
    }
    .typed-cursor--blink { animation: blink 1.05s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 600px) {
      main { padding: 7vw; }
      h1 { font-size: clamp(2.5rem, 14.5vw, 5.5rem); min-height: 4.32em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typed-cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="hello world"><span aria-hidden="true"><span id="typed">hello world</span></span></h1>
    <div class="sr-only" id="transcript"></div>
  </main>
  <script src="./vendor/typed.umd.js"></script>
  <script>
    const messages = [
      'hello world',
      "oh,^650 you're here.",
      'give me a second^350...',
      'i had a thought.',
      'what if we made^500\nsomething?',
      'not sure what yet.',
      "maybe that's^400\nthe fun part.",
      'start with a word.',
      'then^350 another.',
      'make a mess.',
      'change your mind.',
      'wait.^650\ntry that again.',
      'there you go.',
      'look at us,^600\nmaking something.',
      'anyway,^700\nhello again.'
    ];
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const text = document.querySelector('#typed');
    let typing;

    // A readable transcript avoids announcing every individual keystroke.
    document.querySelector('#transcript').textContent = messages.slice(1)
      .map(message => message.replace(/\^\d+/g, '').replace(/\n/g, ' ')).join(' ');

    function _startTyping() {
      typing?.destroy();
      typing = null;
      text.textContent = 'hello world';
      if (reducedMotion.matches || typeof Typed === 'undefined') return;
      text.textContent = '';
      typing = new Typed(text, {
        strings: messages,
        typeSpeed: 65,
        backSpeed: 28,
        startDelay: 650,
        backDelay: 2100,
        smartBackspace: false,
        loop: true,
        showCursor: true,
        cursorChar: '',
        autoInsertCss: false,
        contentType: 'null'
      });
    }

    _startTyping();
    reducedMotion.addEventListener('change', _startTyping);
  </script>
</body>
</html>
