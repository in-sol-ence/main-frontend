<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdd3">
  <meta name="description" content="Ten hello worlds. Ten entrances.">
  <title>hello world</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      background: #fffdd3;
      color: #e8771e;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    section {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 5vw;
      overflow: clip;
    }
    .phrase {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: .24em;
      margin: 0;
      font-size: min(15.5vw, 36vh);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.065em;
      text-align: center;
    }
    .word { display: block; white-space: nowrap; }
    .letter { display: inline-block; transform-origin: 50% 85%; }
    [data-motion="rise"] .word {
      overflow: clip;
      padding: .12em .08em;
      margin: -.12em -.08em;
    }
    .waiting .phrase { visibility: hidden; }
    @media (max-width: 600px) and (orientation: portrait) {
      .phrase {
        flex-direction: column;
        align-items: center;
        gap: 0;
        font-size: min(30vw, 24svh);
        line-height: 1.04;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .waiting .phrase { visibility: visible; }
    }
  </style>
</head>
<body>
  <main>
    <section data-motion="rise"><h1 class="phrase">hello world</h1></section>
    <section data-motion="wipe"><h2 class="phrase">hello world</h2></section>
    <section data-motion="expand"><h2 class="phrase">hello world</h2></section>
    <section data-motion="flip"><h2 class="phrase">hello world</h2></section>
    <section data-motion="meet"><h2 class="phrase">hello world</h2></section>
    <section data-motion="drop"><h2 class="phrase">hello world</h2></section>
    <section data-motion="focus"><h2 class="phrase">hello world</h2></section>
    <section data-motion="wave"><h2 class="phrase">hello world</h2></section>
    <section data-motion="gather"><h2 class="phrase">hello world</h2></section>
    <section data-motion="type"><h2 class="phrase">hello world</h2></section>
  </main>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const sections = [...document.querySelectorAll('section')];
    const ease = 'cubic-bezier(.16, 1, .3, 1)';
    const activeAnimations = new Map();

    // Keep the original text accessible while animating individual glyphs.
    for (const section of sections) {
      const phrase = section.querySelector('.phrase');
      phrase.setAttribute('aria-label', phrase.textContent);
      const words = phrase.textContent.split(' ').map(text => {
        const word = document.createElement('span');
        word.className = 'word';
        word.setAttribute('aria-hidden', 'true');
        for (const character of text) {
          const letter = document.createElement('span');
          letter.className = 'letter';
          letter.textContent = character;
          word.append(letter);
        }
        return word;
      });
      phrase.replaceChildren(...words);
    }

    function reveal(section) {
      section.classList.remove('waiting');
      if (reducedMotion.matches) return;
      const phrase = section.querySelector('.phrase');
      const letters = [...section.querySelectorAll('.letter')];
      const animations = [];
      const play = (element, frames, options = {}) => {
        animations.push(element.animate(frames, {
          duration: 1400, easing: ease, fill: 'both', ...options
        }));
      };

      switch (section.dataset.motion) {
        case 'rise':
          letters.forEach((letter, i) => play(letter, [
            { transform: 'translateY(115%) rotate(3deg)' },
            { transform: 'translateY(0) rotate(0)' }
          ], { delay: 100 + (9 - i) * 65 }));
          break;
        case 'wipe':
          play(phrase, [
            { clipPath: 'inset(-20% 0 -20% 100%)' },
            { clipPath: 'inset(-20% 0 -20% 0%)' }
          ], { duration: 1900, easing: 'cubic-bezier(.65, 0, .2, 1)' });
          break;
        case 'expand':
          play(phrase, [
            { transform: 'scale(.5)', opacity: 0 },
            { transform: 'scale(1)', opacity: 1 }
          ], { duration: 1900 });
          break;
        case 'flip':
          letters.forEach((letter, i) => play(letter, [
            { transform: 'perspective(700px) rotateX(-95deg)', opacity: 0 },
            { transform: 'perspective(700px) rotateX(0)', opacity: 1 }
          ], { delay: (9 - i) * 75, duration: 1250 }));
          break;
        case 'meet':
          section.querySelectorAll('.word').forEach((word, i) => play(word, [
            { transform: `translateX(${i ? '' : '-'}35vw)`, opacity: 0 },
            { transform: 'translateX(0)', opacity: 1 }
          ], { duration: 1800 }));
          break;
        case 'drop':
          letters.forEach((letter, i) => play(letter, [
            { transform: `translateY(-1.5em) rotate(${i % 2 ? 8 : -8}deg)`, opacity: 0, offset: 0 },
            { transform: 'translateY(.055em) rotate(0)', opacity: 1, offset: .72 },
            { transform: 'translateY(0) rotate(0)', opacity: 1, offset: 1 }
          ], { delay: (9 - i) * 70, duration: 1200, easing: 'cubic-bezier(.22, .7, .3, 1)' }));
          break;
        case 'focus':
          play(phrase, [
            { filter: 'blur(20px)', opacity: 0, transform: 'scale(1.035)' },
            { filter: 'blur(0)', opacity: 1, transform: 'scale(1)' }
          ], { duration: 2100, easing: 'cubic-bezier(.22, .6, .2, 1)' });
          break;
        case 'wave':
          letters.forEach((letter, i) => play(letter, [
            { transform: 'translateY(.55em)', opacity: 0, offset: 0 },
            { transform: 'translateY(-.12em)', opacity: 1, offset: .55 },
            { transform: 'translateY(0)', opacity: 1, offset: 1 }
          ], { delay: (9 - i) * 90, duration: 1300, easing: 'cubic-bezier(.37, 0, .25, 1)' }));
          break;
        case 'gather':
          letters.forEach((letter, i) => play(letter, [
            { transform: `translateX(${(i - 4.5) * .3}em)`, opacity: 0 },
            { transform: 'translateX(0)', opacity: 1 }
          ], { duration: 1900, delay: Math.abs(i - 4.5) * 45 }));
          break;
        case 'type':
          letters.forEach((letter, i) => play(letter, [
            { opacity: 0 }, { opacity: 1 }
          ], { delay: 180 + (9 - i) * 135, duration: 1, easing: 'steps(1, end)' }));
          break;
      }
      activeAnimations.set(section, animations);
    }

    if ('IntersectionObserver' in window && 'animate' in Element.prototype) {
      if (!reducedMotion.matches) sections.forEach(section => section.classList.add('waiting'));
      const observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (entry.intersectionRatio >= .4 && !activeAnimations.has(entry.target)) {
            reveal(entry.target);
          } else if (!entry.isIntersecting) {
            for (const animation of activeAnimations.get(entry.target) || []) animation.cancel();
            activeAnimations.delete(entry.target);
            if (!reducedMotion.matches) entry.target.classList.add('waiting');
          }
        }
      }, { threshold: [0, .4] });
      sections.forEach(section => observer.observe(section));
      reducedMotion.addEventListener('change', () => {
        for (const animations of activeAnimations.values()) {
          for (const animation of animations) animation.cancel();
        }
        activeAnimations.clear();
        sections.forEach(section => section.classList.remove('waiting'));
      });
    }
  </script>
</body>
</html>
