<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="skatebored — an adaptive learning platform.">
  <title>skatebored</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- device-notice:start -->
  <aside id="device-notice" aria-labelledby="device-notice-title">
    <div>
      <h2 id="device-notice-title">Best on desktop</h2>
      <p>We&#39;re still tuning the mobile experience. Open this on a laptop or desktop for now; full support is on the way!</p>
    </div>
  </aside>
  <!-- device-notice:end -->

  <main id="pages">
    <section id="home" class="page">
    <div class="intro">
      <h1 aria-label="skatebored" data-page-heading tabindex="-1"><span aria-hidden="true"><span id="typed">skatebored</span></span></h1>
      <div class="actions">
        <button id="demo-button" type="button" disabled></button>
        <a id="contact-link"></a>
      </div>
    </div>

    <div class="sr-only" id="transcript"></div>
    </section>
    <section id="demo" class="page demo-page" inert aria-hidden="true">
      <div class="intro demo-intro">
        <h1 class="demo-heading" data-page-heading tabindex="-1"><span aria-hidden="true" id="demo-typed"></span></h1>
      </div>
      <div id="knowledge-slot" class="knowledge-slot" aria-hidden="true"></div>
      <button id="demo-next" class="demo-next" type="button" hidden></button>
      <button id="back-button" type="button" hidden>Back to skatebored</button>
    </section>
    <div id="knowledge-volume" class="knowledge-volume" aria-label="Interactive knowledge space. Drag to orbit and scroll to zoom." aria-hidden="true" inert></div>
  </main>
  <div id="skateboard" role="img" aria-label="Interactive Globe Down in Flames skateboard. Drag to rotate and double-click to reset."></div>
  <div id="spatial-stage" inert aria-hidden="true">
    <iframe id="spatial-frame" title="Skatebored spatial learning journey" src="about:blank"></iframe>
  </div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script type="module" src="./skateboard.js"></script>
  <script src="./vendor/typed.umd.js"></script>
  <script type="module" src="./text.js"></script>
  <script type="module" src="./knowledge/knowledge.js"></script>
</body>
</html>
