<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdd3">
  <meta name="description" content="hello world">
  <title>hello world</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      background: #fffdd3;
      color: #e8771e;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    main {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 5vw;
    }

    h1 {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: .24em;
      margin: 0;
      font-size: min(15.5vw, 36vh);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.065em;
    }

    .word {
      display: block;
      white-space: nowrap;
      overflow: clip;
      padding: .12em .08em;
      margin: -.12em -.08em;
    }

    .letter {
      display: inline-block;
      transform-origin: 50% 100%;
      animation: arrive 1450ms cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: calc(140ms + var(--i) * 62ms);
    }

    @keyframes arrive {
      from { transform: translate3d(0, 115%, 0) rotate(3deg); }
      to { transform: translate3d(0, 0, 0) rotate(0); }
    }

    @media (max-width: 600px) and (orientation: portrait) {
      h1 {
        flex-direction: column;
        align-items: center;
        gap: 0;
        font-size: min(30vw, 24svh);
        line-height: 1.04;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="hello world">
      <span class="word" aria-hidden="true"><span class="letter" style="--i:0">h</span><span class="letter" style="--i:1">e</span><span class="letter" style="--i:2">l</span><span class="letter" style="--i:3">l</span><span class="letter" style="--i:4">o</span></span>
      <span class="word" aria-hidden="true"><span class="letter" style="--i:6">w</span><span class="letter" style="--i:7">o</span><span class="letter" style="--i:8">r</span><span class="letter" style="--i:9">l</span><span class="letter" style="--i:10">d</span></span>
    </h1>
  </main>
</body>
</html>
